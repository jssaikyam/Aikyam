<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackathon Countdown</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }

        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            position: relative;
            z-index: 2;
        }

        .countdown {
            display: flex;
            gap: 40px;
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 20px;
            border: 3px solid #ff0000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
            position: relative;
        }

        .countdown::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border-radius: 20px;
            background: linear-gradient(45deg, #ff0000, transparent, #ff0000);
            z-index: -1;
            animation: borderGlow 3s linear infinite;
        }

        .time-segment {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 100px;
        }

        .time-value {
            font-size: 4rem;
            font-weight: bold;
            color: #ff0000;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            animation: pulse 2s infinite;
        }

        .time-label {
            font-size: 1.2rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
        }

        .binary-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .title {
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff0000;
            font-size: 2.5rem;
            text-align: center;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            white-space: nowrap;
            animation: glitch 5s infinite;
        }

        .date-display {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff0000;
            font-size: 1.2rem;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            white-space: nowrap;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }
        }

        @keyframes borderGlow {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        @keyframes glitch {
            0% {
                transform: translateX(-50%) skew(0deg);
                text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            }
            2% {
                transform: translateX(-50%) skew(20deg);
                text-shadow: 3px 3px 0 #ff0000, -3px -3px 0 #0000ff;
            }
            4% {
                transform: translateX(-50%) skew(0deg);
                text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            }
            50% {
                text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            }
            52% {
                text-shadow: 3px 3px 0 #ff0000, -3px -3px 0 #0000ff;
            }
            54% {
                text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            }
        }

        @media (max-width: 768px) {
            .countdown {
                gap: 20px;
                padding: 20px;
            }

            .time-segment {
                min-width: 70px;
            }

            .time-value {
                font-size: 2.5rem;
            }

            .time-label {
                font-size: 0.9rem;
            }

            .title {
                font-size: 1.8rem;
                top: -80px;
            }

            .date-display {
                font-size: 1rem;
                top: -30px;
            }
        }
        .back-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            backface-visibility: hidden;
            /* background: rgba(197, 2, 2, 0.8); */
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            z-index: 1000;
            transition: all 0.3s ease;
            font-size: 1.5rem ;
        }

        .back-button:hover {
            background: rgb(255, 0, 0);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <canvas class="binary-rain" id="binaryRain"></canvas>
    <div class="container">
        <h1 class="title">HACKATHON COUNTDOWN</h1>
        <div class="date-display">March 6, 2025 12:00 PM - March 7, 2025 12:00 PM</div>
        <div class="countdown">
            <div class="time-segment">
                <div class="time-value" id="hours">24</div>
                <div class="time-label">Hours</div>
            </div>
            <div class="time-segment">
                <div class="time-value" id="minutes">00</div>
                <div class="time-label">Minutes</div>
            </div>
            <div class="time-segment">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">Seconds</div>
            </div>
        </div>
    </div>
    <a href="index.html" class="back-button">Home</a>

    <script>
        // Binary Rain Animation
        const canvas = document.getElementById('binaryRain');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const binary = '10'.split('');
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawBinaryRain() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff0000';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = binary[Math.floor(Math.random() * binary.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        // Countdown Timer
        function updateCountdown() {
            const startDate = new Date('2025-03-06T12:00:00');
            const endDate = new Date('2025-03-07T12:00:00');

            function update() {
                const now = new Date();
                
                // Before the event starts
                if (now < startDate) {
                    document.getElementById('hours').textContent = '24';
                    document.getElementById('minutes').textContent = '00';
                    document.getElementById('seconds').textContent = '00';
                    return;
                }
                
                // After the event ends
                if (now >= endDate) {
                    document.getElementById('hours').textContent = '00';
                    document.getElementById('minutes').textContent = '00';
                    document.getElementById('seconds').textContent = '00';
                    return;
                }
                
                // During the event
                const timeLeft = endDate - now;
                
                const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

                document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
                document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
                document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
            }

            // Update countdown every second
            setInterval(update, 1000);
            update(); // Initial call
        }

        // Start animations and countdown
        setInterval(drawBinaryRain, 50);
        updateCountdown();

        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
