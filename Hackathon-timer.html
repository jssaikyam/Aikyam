<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock Disintegration</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #000;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }

    .container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .digital-clock {
      position: relative;
      width: 400px;
      height: 200px;
      margin: 50px auto;
      transform-style: preserve-3d;
      perspective: 1000px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .clock-face {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: rgba(30, 30, 30, 0.8);
      border: 4px solid #ff0000;
      border-radius: 20px;
      box-shadow: 0 0 20px #ff0000, inset 0 0 30px rgba(255, 0, 0, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .clock-display {
      font-size: 5rem;
      color: #ff0000;
      text-shadow: 0 0 15px #ff0000;
      font-family: 'Digital-7', 'Courier New', monospace;
      letter-spacing: 5px;
      position: relative;
      z-index: 2;
    }

    .clock-buttons {
      position: absolute;
      width: 15px;
      height: 15px;
      background-color: #ff0000;
      border-radius: 50%;
      box-shadow: 0 0 10px #ff0000;
    }

    .button-1 { top: 20px; left: 20px; }
    .button-2 { top: 20px; right: 20px; }
    .button-3 { bottom: 20px; left: 20px; }
    .button-4 { bottom: 20px; right: 20px; }

    .clock-circuit {
      position: absolute;
      background-color: transparent;
      border: 1px solid rgba(255, 0, 0, 0.5);
      box-shadow: 0 0 5px rgba(255, 0, 0, 0.3);
      z-index: 1;
    }

    .circuit-1 {
      width: 80%;
      height: 2px;
      top: 40px;
      left: 10%;
    }

    .circuit-2 {
      width: 80%;
      height: 2px;
      bottom: 40px;
      left: 10%;
    }

    .circuit-3 {
      width: 2px;
      height: 60%;
      top: 20%;
      left: 30px;
    }

    .circuit-4 {
      width: 2px;
      height: 60%;
      top: 20%;
      right: 30px;
    }

    .timer {
      font-size: 2.5rem;
      color: #ff0000;
      margin-top: 20px;
      text-shadow: 0 0 10px #ff0000;
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
    }

    .burst-particle {
      position: absolute;
      width: 8px;
      height: 8px;
      background-color: #ff0000;
      border-radius: 50%;
      box-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
      opacity: 0;
      pointer-events: none;
    }

    .shard {
      position: absolute;
      background-color: rgba(255, 0, 0, 0.3);
      border: 1px solid #ff0000;
      box-shadow: 0 0 10px #ff0000;
      transform-origin: center;
      opacity: 1;
      pointer-events: none;
    }

    .disintegrate {
      animation: disintegrate 1.5s forwards;
    }

    @keyframes disintegrate {
      0% {
        transform: scale(1) rotate(0);
        opacity: 1;
        filter: blur(0);
      }
      100% {
        transform: scale(0.2) rotate(15deg);
        opacity: 0;
        filter: blur(10px);
      }
    }

    .message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 4rem;
      color: #ff0000;
      text-shadow: 0 0 20px #ff0000;
      opacity: 0;
      transition: opacity 1s;
      font-family: 'Impact', sans-serif;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .show-message {
      opacity: 1;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        text-shadow: 0 0 20px #ff0000;
        transform: translate(-50%, -50%) scale(1);
      }
      50% {
        text-shadow: 0 0 40px #ff0000, 0 0 60px #ff0000;
        transform: translate(-50%, -50%) scale(1.05);
      }
      100% {
        text-shadow: 0 0 20px #ff0000;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .background-effect {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
      opacity: 0;
      transition: opacity 1s;
    }

    .background-effect.active {
      opacity: 1;
    }

    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 150px 50px #000;
      background: radial-gradient(circle, transparent 50%, #000 100%);
    }

    .dust {
      position: absolute;
      width: 4px;
      height: 4px;
      background-color: #ff0000;
      border-radius: 50%;
      box-shadow: 0 0 5px #ff0000;
      opacity: 0;
    }

    .spark {
      position: absolute;
      width: 2px;
      height: 2px;
      background-color: #ff0000;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff0000, 0 0 12px #ff0000;
      opacity: 0;
      pointer-events: none;
    }

    .circuit-spark {
      position: absolute;
      width: 3px;
      height: 3px;
      background-color: #ff0000;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff0000;
      opacity: 0;
      pointer-events: none;
    }

    .glitch {
      animation: glitch 0.3s infinite;
    }

    @keyframes glitch {
      0% {
        transform: translate(0);
        opacity: 1;
      }
      20% {
        transform: translate(-5px, 5px);
        opacity: 0.8;
      }
      40% {
        transform: translate(5px, -5px);
        opacity: 1;
      }
      60% {
        transform: translate(-3px, 2px);
        opacity: 0.8;
      }
      80% {
        transform: translate(3px, -2px);
        opacity: 1;
      }
      100% {
        transform: translate(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="digital-clock">
      <div class="clock-face">
        <div class="clock-display">10:00</div>
        <div class="clock-buttons button-1"></div>
        <div class="clock-buttons button-2"></div>
        <div class="clock-buttons button-3"></div>
        <div class="clock-buttons button-4"></div>
        <div class="clock-circuit circuit-1"></div>
        <div class="clock-circuit circuit-2"></div>
        <div class="clock-circuit circuit-3"></div>
        <div class="clock-circuit circuit-4"></div>
      </div>
    </div>
    <div class="message">TIME'S UP!</div>
  </div>
  
  <div class="background-effect">
    <div class="vignette"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const clockDisplay = document.querySelector('.clock-display');
  
      // Set the start time to March 6, 12:00 PM
      const startTime = new Date(new Date().getFullYear(), 2, 6, 12, 0, 0).getTime(); // March = 2 (zero-based index)
      
      // Set the end time to March 7, 12:00 PM (24 hours from start)
      const endTime = startTime + 24 * 60 * 60 * 1000;
  
      function updateClock() {
        const now = new Date().getTime();
        
        // Ensure we don't go negative
        const timeLeft = Math.max(0, endTime - now);
  
        const hours = Math.floor((timeLeft / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((timeLeft / (1000 * 60)) % 60);
        const seconds = Math.floor((timeLeft / 1000) % 60);
  
        clockDisplay.textContent = 
          `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          disintegrateClock();
        }
      }
  
      // Update the clock every second
      const timerInterval = setInterval(updateClock, 1000);
      updateClock(); // Run immediately to avoid 1-second delay
  
      function disintegrateClock() {
        alert("Time is up! The countdown has ended.");
        // Add your clock disintegration animation here
      }
    });
  </script>
  
  
</body>
</html>
